name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign the build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # GoReleaser reads the previous tag
      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Release notes from CHANGELOG.md
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the geet-bin PKGBUILD to the AUR. Unused while
          # aurs.skip_upload is true in .goreleaser.yaml.
          AUR_KEY: ${{ secrets.AUR_KEY }}
          # Pushes the formula to github.com/sumdahl/homebrew-geet.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: build/SHA256SUMS
