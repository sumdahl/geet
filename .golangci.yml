version: "2"

linters:
  default: standard
  exclusions:
    # Unchecked Close/Write/Remove and similar idioms, and test helpers
    # writing fixtures: golangci-lint's own presets for well-known noise.
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # Test servers and fixture setup write without checking; a failure
      # there fails the test's own assertions anyway.
      - path: _test\.go
        linters: [errcheck]
  settings:
    staticcheck:
      checks:
        - all
        # golangci-lint's defaults: package comments and naming nits.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # "Apply De Morgan's law" rewrites range checks less readably.
        - -QF1001

formatters:
  enable:
    - gofmt
